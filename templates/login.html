<!DOCTYPE html>
<html>
<head><title>Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<div class="login-box">
<h2>Aadhar Login</h2>
{% with messages = get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert {{c}}">{{m}}</div>{% endfor %}{% endwith %}
<form method="POST">
<label>Aadhar No</label><input type="text" name="aadhar_no" maxlength="12" required>
<label>Password</label><input type="password" name="password" required>
<button type="submit">Login</button>
</form>
<p>New user? <a href="/register">Register</a></p>
</div></body></html>
