<!DOCTYPE html><html><head><title>Register</title>
<style>body{background:#667eea;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:white;padding:30px;border-radius:10px;width:350px}</style></head>
<body><div class="box"><h2>Register</h2>
<form action="/register" method="POST">
<input name="name" placeholder="Full Name" required style="width:100%;padding:10px;margin:5px 0">
<input name="aadhar" placeholder="12 Digit Aadhar" required style="width:100%;padding:10px;margin:5px 0">
<input name="mobile" placeholder="Mobile" required style="width:100%;padding:10px;margin:5px 0">
<input type="password" name="password" placeholder="Password" required style="width:100%;padding:10px;margin:5px 0">
<button style="width:100%;padding:10px;background:#667eea;color:white;border:none">Get OTP</button>
</form><a href="/">Back to Login</a></div></body></html>
